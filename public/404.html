<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Studio</title>
  </head>
  <body>
    <script>
      (function () {
        var base = '/Live2D_Tester/';
        var path = window.location.pathname.indexOf(base) === 0
          ? window.location.pathname.slice(base.length)
          : '';
        var route = '/' + path.replace(/&/g, '~and~');
        var query = window.location.search
          ? '&' + window.location.search.slice(1).replace(/&/g, '~and~')
          : '';
        window.location.replace(base + '?' + route + query + window.location.hash);
      })();
    </script>
  </body>
</html>
